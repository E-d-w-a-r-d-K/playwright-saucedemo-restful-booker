name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# read-only by default; the pages job asks for what it needs
permissions:
  contents: read

# one run per branch: a newer push cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # pinned, not ubuntu-latest: the linux screenshot baselines depend on this image's fonts and rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI, visual and API tests
        run: npx playwright test

      # Allure history (trend between runs) lives in the Actions cache.
      - name: Restore Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure-history-${{ github.ref_name }}-

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Save Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results, traces and screenshot diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Prepare Allure report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # Publishes the Allure report of the latest main run at the repository's GitHub Pages address.
  pages:
    needs: playwright
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
